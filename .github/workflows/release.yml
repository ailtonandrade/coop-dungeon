# Gera o release do jogo para baixar no GitHub.
# Como usar: crie uma tag de versão e mande para o GitHub, por exemplo:
#   git tag v0.2.0
#   git push origin v0.2.0
# O GitHub exporta Windows, Linux e Web com o Godot 4.7 e publica em Releases com os .zip.
# Também dá para rodar à mão em Actions > Release > Run workflow (gera só os arquivos, sem release).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar o Godot e os modelos de exportação
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          rm -rf templates *.zip *.tpz

      - name: Importar os recursos do projeto
        run: ./godot --headless --path . --import || ./godot --headless --path . --editor --quit

      - name: Exportar
        run: |
          mkdir -p build/windows build/linux build/web
          ./godot --headless --path . --export-release "Windows" build/windows/Corrumpted.exe
          ./godot --headless --path . --export-release "Linux" build/linux/Corrumpted.x86_64
          ./godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/windows/Corrumpted.exe && test -f build/linux/Corrumpted.x86_64 && test -f build/web/index.html

      - name: Empacotar
        run: |
          version="${GITHUB_REF_NAME}"
          cd build
          (cd windows && zip -qr "../Corrumpted-${version}-Windows.zip" .)
          (cd linux && chmod +x Corrumpted.x86_64 && zip -qr "../Corrumpted-${version}-Linux.zip" .)
          (cd web && zip -qr "../Corrumpted-${version}-Web.zip" .)
          ls -la *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: corrumpted-${{ github.ref_name }}
          path: build/*.zip

      - name: Publicar o release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Corrumpted ${{ github.ref_name }}
          files: build/*.zip
          generate_release_notes: true
          body: |
            **Como jogar**
            - **Windows:** baixe `Corrumpted-${{ github.ref_name }}-Windows.zip`, extraia a pasta e abra `Corrumpted.exe`
              (se o Windows avisar "aplicativo desconhecido": Mais informações > Executar assim mesmo).
            - **Linux:** baixe o `-Linux.zip`, extraia e rode `./Corrumpted.x86_64`.
            - **Web:** o `-Web.zip` é para hospedar (itch.io, por exemplo); no navegador só tem o co-op de sofá.

            Jogar online com amigos: veja `docs/JOGAR_ONLINE.md` no repositório.
